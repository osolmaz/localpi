<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="localpi: an unopinionated Pi distribution that makes it easy to test and work with small local models on constrained systems">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Centered wordmark: local, then the Greek pi (content spans y 95-232, centered on 160) -->
  <text x="480" y="134" class="mono" font-size="54" font-weight="700" text-anchor="middle">
    <tspan fill="#e6edf3">local</tspan><tspan fill="#58a6ff">&#960;</tspan>
  </text>

  <line x1="420" y1="168" x2="540" y2="168" stroke="#30363d" stroke-width="2"/>

  <text x="480" y="200" class="sans" font-size="17" fill="#8b949e" text-anchor="middle">Unopinionated Pi distribution that makes it easy to test and work with</text>
  <text x="480" y="228" class="sans" font-size="17" fill="#8b949e" text-anchor="middle">small local models on constrained systems</text>
</svg>
